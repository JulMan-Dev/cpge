[package]
name = "cpge"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[features]
default = ["gl"]
std = []
gl = ["std", "dep:vulkano", "dep:objc"]

[target.'cfg(target_os = "macos")'.dependencies]
objc = { version = "0.2.7", optional = true }

[dependencies]
arrayvec = "0.7.8"
num-traits = "0.2.19"
rust_decimal = { version = "1.42.1", features = ["macros", "maths"] }
vulkano = { version = "0.35.2", optional = true }

[build-dependencies]
build-rs = "0.3.5"
cmake = "0.1.58"
walkdir = "2.5.0"
